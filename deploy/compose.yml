name: termchat

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-termchat}
      POSTGRES_USER: ${POSTGRES_USER:-termchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - backend
    logging: *default-logging

  migrate:
    image: migrate/migrate:v4.19.1
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-termchat}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-termchat}?sslmode=disable
      - up
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${TERMCHAT_IMAGE:-termchat-server:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      TERMCHAT_LISTEN_ADDR: :8080
      TERMCHAT_DATABASE_URL: postgres://${POSTGRES_USER:-termchat}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-termchat}?sslmode=disable
      TERMCHAT_JWT_SECRET: ${TERMCHAT_JWT_SECRET:?TERMCHAT_JWT_SECRET must be set}
      TERMCHAT_TOKEN_TTL: ${TERMCHAT_TOKEN_TTL:-24h}
      TERMCHAT_CLEANUP_INTERVAL: ${TERMCHAT_CLEANUP_INTERVAL:-1h}
    ports:
      - "${TERMCHAT_BIND_IP:?TERMCHAT_BIND_IP must be set}:${TERMCHAT_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    networks:
      - backend
    logging: *default-logging

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
